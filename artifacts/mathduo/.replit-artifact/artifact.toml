kind = "web"
previewPath = "/"
title = "MathDuo"
version = "1.0.0"
id = "artifacts/mathduo"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18314

[services.development]
run = "pnpm --filter @workspace/mathduo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mathduo", "run", "build" ]
publicDir = "artifacts/mathduo/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18314"
BASE_PATH = "/"
